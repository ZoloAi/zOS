name: zOS baseline

# The native-runner rungs of the cross-platform gate. Coverage map:
#   - darwin-arm64:  this Mac, scripts/zos_baseline.py (local)
#   - linux-aarch64: scripts/docker_baseline.sh (native-speed container, local)
#   - linux-x86_64:  ubuntu-latest below — Chromium cannot run under QEMU
#                    user emulation, so emulated local runs can't exercise
#                    browser suites; a native runner can.
#   - win-amd64:     windows-latest below
#   - win-arm64:     windows-11-arm below (Playwright ships no ARM browsers;
#                    Chromium runs as x64 under Windows' built-in emulation,
#                    which — unlike QEMU — handles it fine)
#   - darwin-x86_64: no free native runner; covered by AWS/real-metal phase.
#
# Installs the wheel built from the checked-out source (so pushes gate on the
# code they carry) and runs every zRaven suite of every committed demo.
# zguard binaries provision themselves from zguard_bin/ on raw GitHub.

on:
  workflow_dispatch:
    inputs:
      demos:
        description: "comma-separated demo subset (empty = all)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "core/**"
      - "zDemos/**"
      - "zguard_bin/**"
      - "scripts/zos_baseline.py"
      - "pyproject.toml"
      - "setup.py"

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  # Demos print box-drawing/checkmark glyphs; Windows Python would otherwise
  # decode/encode with the legacy code page and crash.
  PYTHONUTF8: "1"

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build zolo-os wheel from this checkout
        run: |
          python -m pip install --quiet build
          python -m build --wheel

      - name: Run baseline matrix
        shell: python
        env:
          DEMOS: ${{ inputs.demos }}
        run: |
          import glob, os, subprocess, sys
          wheel = glob.glob("dist/zolo_os-*.whl")[0]
          cmd = [sys.executable, "scripts/zos_baseline.py", "--wheel", wheel, "--keep"]
          if os.environ.get("DEMOS"):
              cmd += ["--demos", os.environ["DEMOS"]]
          sys.exit(subprocess.run(cmd).returncode)

      - name: Upload run artifacts (report + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-run-${{ matrix.os }}
          # Only the harness's own logs/ dir — staged demos generate their own
          # log files whose names can carry characters (colons) that the
          # artifact store refuses.
          path: |
            ~/zos-baseline-runs/*/baseline_report.json
            ~/zos-baseline-runs/*/logs/*.log
          if-no-files-found: ignore
